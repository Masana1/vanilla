name: Build Switch Only

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: build (nintendoswitch, aarch64, vanilla-nintendoswitch-image.zip)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies for cross-compiling
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support

      - name: Run docker/setup-buildx-action@v3
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.builder
          target: nintendoswitch
          platforms: linux/aarch64
          load: true
          tags: vanilla:nintendoswitch

      - name: Extract build
        run: |
          docker run --rm -v ${{ github.workspace }}:/output vanilla:nintendoswitch cp -r /vanilla/build /output/build

      - name: Archive (Nintendo Switch)
        run: |
          cd build
          zip -r ../vanilla-nintendoswitch-image.zip *
          cd ..

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vanilla-nintendoswitch-image.zip
          path: vanilla-nintendoswitch-image.zip
