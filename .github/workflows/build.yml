name: Build Switch Only

on:
  push:
  workflow_dispatch:

jobs:
  build-switch:
    name: build-nintendoswitch-arm64
    runs-on: ubuntu-latest
    container: alpine:3.16
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apk update
          apk add --no-cache \
            git build-base cmake make pkgconf zip \
            openssl1.1-compat-dev sdl2-dev sdl2_image-dev sdl2_ttf-dev \
            ffmpeg-dev libdrm-dev mesa-dev libxml2-dev libnl3-dev \
            networkmanager-dev polkit-dev

      - name: Build Vanilla Switch
        run: |
          mkdir -p build_switch
          cd build_switch
          cmake ..
          make -j8

      - name: Package Switch Binary
        run: |
          mkdir -p dist
          find build_switch -name vanilla -type f -exec cp {} dist/ \; || true
          find build_switch/bin -name vanilla -type f -exec cp {} dist/ \; || true
          cd dist
          zip vanilla-nintendoswitch-arm64.zip *
          cd ..

      - name: Upload Switch Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vanilla-nintendoswitch-arm64
          path: dist/vanilla-nintendoswitch-arm64.zip
