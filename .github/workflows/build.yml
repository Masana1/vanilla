name: Build Switch Only

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: build (nintendoswitch, aarch64, vanilla-nintendoswitch-image.zip)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: nintendoswitch
            arch: aarch64
            archive: vanilla-nintendoswitch-image.zip
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies for cross-compiling
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: vanilla:${{ matrix.target }}

      - name: Extract build artifact from container
        run: |
          mkdir -p output
          docker create --name extract vanilla:${{ matrix.target }}
          docker cp extract:/vanilla/dist/. output/ 2>/dev/null || docker cp extract:/build/. output/ 2>/dev/null || docker cp extract:/vanilla/build/. output/ 2>/dev/null || true
          docker rm extract
          cd output
          zip -r ../${{ matrix.archive }} *
          cd ..

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
