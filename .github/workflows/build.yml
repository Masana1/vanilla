name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: build (nintendoswitch, aarch64, vanilla-nintendoswitch-image.zip)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: nintendoswitch
            arch: aarch64
            archive: vanilla-nintendoswitch-image.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies for cross-compiling
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support

      - name: Run docker/setup-buildx-action@v3
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: vanilla:${{ matrix.target }}

      - name: Run Docker container
        run: |
          docker run --rm -v ${{ github.workspace }}:/output vanilla:${{ matrix.target }} cp -r /vanilla/build /output/build

      - name: Archive (Nintendo Switch)
        run: |
          cd build
          zip -r ../${{ matrix.archive }} *
          cd ..

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
