name: Build Switch Only

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: compilation (nintendoswitch, aarch64, vanilla-nintendoswitch-image.zip)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: nintendoswitch
          platforms: linux/arm64
          load: true
          tags: vanilla:nintendoswitch

      - name: Run Docker container and extract build
        run: |
          mkdir -p dist
          docker create --name extract vanilla:nintendoswitch
          docker cp extract:/dist/. dist/ 2>/dev/null || docker cp extract:/build/. dist/ 2>/dev/null || docker cp extract:/vanilla-nintendoswitch-image.zip dist/ 2>/dev/null || true
          docker rm extract

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vanilla-nintendoswitch-image
          path: dist/*
